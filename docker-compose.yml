services:
  backend:
    build: .
    environment:
      - NEUROSCOPE_MODEL=${NEUROSCOPE_MODEL:-gpt2}
      # Compose only forwards variables a service declares, so without this line
      # `make rebuild-cache` (which sets it on the host) would never reach the
      # container and would silently re-use the existing calibration.
      - NEUROSCOPE_REBUILD_CACHE=${NEUROSCOPE_REBUILD_CACHE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
      # No ./frontend/dist bind mount: the image bakes the built frontend in
      # (COPY --from=frontend-builder). Mounting a host dist/ shadowed it and
      # served 404s whenever that directory was empty or stale.
    ports:
      - "3000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/model-info')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  hf-cache:
